name: Beta feedback
description: Report a bug or confusing workflow without including personal application data.
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: "Please remove names, email addresses, resumes, answers, tokens, and employer-only information. Public issues can be seen by others if the repository is public."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Onboarding", "Autofill", "Form review", "Account", "Resumes", "AI drafting", "Tracker", "Other"]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 130 on macOS"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Application platform
      options: ["Generic HTML", "Greenhouse", "Lever", "Unknown", "Not applicable"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps using test data
      description: Include only steps that can be shared safely.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
