name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          npm ci
          python -m pip install -e './apps/api[dev]'
      - name: Typecheck, lint, test and build
        run: npm run check
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off --skip-editable
      - name: Upload tested extension bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: auto-fill-extension-${{ github.sha }}
          path: apps/extension/dist/
          if-no-files-found: error
          retention-days: 14
