<!doctype html><html><body>
<form id="newsletter"><label>Email</label><input name="email" type="email"></form>
<form id="application_form" action="https://boards.greenhouse.io/example/jobs/1">
  <input name="first_name" required>
  <input name="last_name" required>
  <input name="email" type="email" required>
  <input name="phone" type="tel">
  <input name="linkedin_url" type="url">
  <label for="resume">Resume</label><input id="resume" type="file" required>
  <fieldset><legend>Are you authorized to work?</legend><label><input name="authorization" type="radio" required value="yes">Yes</label><label><input name="authorization" type="radio" value="no">No</label></fieldset>
  <button type="submit">Submit application</button>
</form>
</body></html>
